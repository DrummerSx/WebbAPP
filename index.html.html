<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>АстроТапалка: Галактика</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --gold: #ffd700;
      --dark: #090818;
      --text: #e0e0ff;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    body {
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      overflow-x: hidden;
      position: relative;
    }
    #galaxy-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .container {
      max-width: 520px;
      margin: 0 auto;
      position: relative;
      z-index: 10;
    }
    header {
      text-align: center;
      padding: 12px 0;
    }
    #region-title {
      font-size: 20px;
      margin-bottom: 6px;
      color: var(--gold);
    }
    #balance {
      font-size: 22px;
      font-weight: bold;
      color: var(--gold);
      margin: 8px 0;
    }
    .income {
      font-size: 15px;
      opacity: 0.85;
    }
    .planets {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin: 24px 0;
      justify-items: center;
    }
    .planet-container {
      position: relative;
      width: 100px;
      height: 100px;
    }
    .planet-svg {
      width: 100%;
      height: 100%;
      cursor: pointer;
      transition: transform 0.2s;
      filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.3));
    }
    .planet-svg:hover {
      transform: scale(1.08);
    }
    .planet-name {
      position: absolute;
      top: 105%;
      width: 100%;
      text-align: center;
      font-size: 11px;
      white-space: nowrap;
      margin-top: 4px;
      color: #ccc;
    }
    .shop {
      background: rgba(15, 10, 30, 0.7);
      padding: 16px;
      border-radius: 16px;
      margin-top: 20px;
    }
    .shop h3 {
      text-align: center;
      margin-bottom: 12px;
      color: var(--gold);
    }
    .upgrade-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #3a3350;
    }
    .buy-btn {
      background: var(--gold);
      color: var(--dark);
      border: none;
      padding: 5px 10px;
      border-radius: 16px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
    }
    .buy-btn:disabled {
      background: #555;
      cursor: not-allowed;
    }
    .travel-btn {
      margin-top: 12px;
      padding: 8px 16px;
      background: linear-gradient(90deg, #6a5acd, #4b0082);
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 0 10px rgba(106, 90, 205, 0.5);
    }
    .asteroid {
      position: absolute;
      width: 32px;
      height: 32px;
      z-index: 20;
      cursor: pointer;
    }
    #star-map {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(ellipse at center, #000033 0%, #000000 70%, #1a0033 100%);
      display: none;
      z-index: 100;
    }
    #map-svg {
      width: 100%; height: 100%;
    }
    .star {
      cursor: pointer;
    }
    .star:hover circle {
      fill: gold !important;
      r: 10;
    }
    #ship {
      animation: shipGlow 2s infinite alternate;
    }
    @keyframes shipGlow {
      from { filter: drop-shadow(0 0 4px red); }
      to { filter: drop-shadow(0 0 12px #ff4500); }
    }
  </style>
</head>
<body>
  <!-- Галактический фон -->
  <svg id="galaxy-bg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="galaxy" cx="50%" cy="50%" r="80%">
        <stop offset="0%" stop-color="#1a0033" stop-opacity="0.8"/>
        <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
      </radialGradient>
      <radialGradient id="nebula" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#8a2be2" stop-opacity="0.6"/>
        <stop offset="100%" stop-color="#4b0082" stop-opacity="0"/>
      </radialGradient>
      <radialGradient id="sunGradient" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ffd700"/>
        <stop offset="100%" stop-color="#ff8c00"/>
      </radialGradient>
    </defs>
    <rect width="100%" height="100%" fill="url(#galaxy)" />
    <!-- Звёзды -->
    <circle cx="15%" cy="20%" r="1.2" fill="white" opacity="0.9"/>
    <circle cx="30%" cy="10%" r="0.9" fill="white" opacity="0.7"/>
    <circle cx="50%" cy="25%" r="1.1" fill="white" opacity="0.8"/>
    <circle cx="70%" cy="15%" r="1.0" fill="white" opacity="0.8"/>
    <circle cx="85%" cy="30%" r="0.8" fill="white" opacity="0.6"/>
    <!-- Туманность -->
    <ellipse cx="40%" cy="60%" rx="15%" ry="8%" fill="url(#nebula)" opacity="0.15"/>
  </svg>

  <div class="container">
    <header>
      <div id="region-title">Солнечная система</div>
      <div id="balance">0</div>
      <div class="income" id="income">Доход: 0.0 ₿/сек</div>
      <button class="travel-btn" id="travel-btn">🗺 Звёздная карта</button>
    </header>

    <div class="planets" id="planets-container"></div>

    <div class="shop">
      <h3>🔭 Улучшения</h3>
      <div id="shop-items"></div>
    </div>
  </div>

  <!-- Звёздная карта -->
  <div id="star-map">
    <svg id="map-svg" viewBox="0 0 400 400">
      <!-- Млечный Путь -->
      <path d="M0,200 Q100,150 200,200 T400,200" fill="none" stroke="#6a5acd" stroke-width="2" opacity="0.3"/>
      
      <!-- Солнце -->
      <g id="sun-group">
        <circle cx="200" cy="200" r="14" fill="url(#sunGradient)" />
        <animate attributeName="fill" values="#ffd700;#ff8c00;#ffd700" dur="3s" repeatCount="indefinite"/>
      </g>
      <text x="200" y="180" text-anchor="middle" fill="white" font-size="12">Солнце</text>
      
      <!-- Проксима Центавра -->
      <g class="star" data-id="proxima">
        <circle cx="80" cy="100" r="9" fill="white" />
        <text x="80" y="85" text-anchor="middle" fill="white" font-size="10">Проксима</text>
      </g>
      
      <!-- Сириус -->
      <g class="star" data-id="sirius">
        <circle cx="320" cy="80" r="10" fill="lightblue" />
        <text x="320" y="65" text-anchor="middle" fill="white" font-size="10">Сириус</text>
      </g>
      
      <!-- Корабль -->
      <polygon id="ship" points="198,202 202,202 200,198" fill="red" style="opacity:0;" />
    </svg>
  </div>

  <script>
    // === Инициализация Telegram ===
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.setHeaderColor("#090818");
    tg.setBackgroundColor("#090818");

    // === Данные от бота ===
    const urlParams = new URLSearchParams(window.location.search);
    const gameData = urlParams.get('data') 
      ? JSON.parse(decodeURIComponent(urlParams.get('data'))) 
      : {
          astro_coins: 0,
          current_region: 'solar',
          unlocked_regions: ['solar'],
          region_states: { solar: {} }
        };

    let displayScore = gameData.astro_coins * 10000;
    let currentRegion = gameData.current_region;
    let unlockedRegions = gameData.unlocked_regions || ['solar'];
    let regionStates = gameData.region_states || { solar: {} };

    // === SVG-модели планет ===
    const planetSVGs = {
      mercury: `<circle cx="50" cy="50" r="40" fill="#b0b0b0"/><circle cx="40" cy="40" r="5" fill="#999"/>`,
      venus: `<circle cx="50" cy="50" r="40" fill="#e39e54"/><circle cx="60" cy="30" r="8" fill="#c9803a" opacity="0.6"/>`,
      earth: `<circle cx="50" cy="50" r="40" fill="#4a7f4b"/><circle cx="30" cy="60" r="10" fill="#3a6f3b" opacity="0.7"/>`,
      mars: `<circle cx="50" cy="50" r="40" fill="#c1440e"/><circle cx="70" cy="40" r="7" fill="#a03005" opacity="0.6"/>`,
      jupiter: `<circle cx="50" cy="50" r="40" fill="#d8ca9d"/><ellipse cx="50" cy="50" rx="40" ry="10" fill="#c0b070" opacity="0.6"/>`,
      saturn: `<circle cx="50" cy="50" r="40" fill="#e3e0c0"/><ellipse cx="50" cy="50" rx="60" ry="10" fill="#d0c080" opacity="0.7"/>`,
      uranus: `<circle cx="50" cy="50" r="40" fill="#c3e8f2"/><circle cx="40" cy="60" r="8" fill="#a0d0e0" opacity="0.6"/>`,
      neptune: `<circle cx="50" cy="50" r="40" fill="#4a5c8a"/><circle cx="60" cy="40" r="6" fill="#3a4a7a" opacity="0.7"/>`,
      pluto: `<circle cx="50" cy="50" r="40" fill="#a8926f"/><circle cx="30" cy="30" r="5" fill="#8a725f" opacity="0.8"/>`,
      proxima_b: `<circle cx="50" cy="50" r="40" fill="#5e8c6a"/><circle cx="60" cy="40" r="8" fill="#4a7055" opacity="0.7"/>`,
      sirius_a: `<circle cx="50" cy="50" r="40" fill="#ffffff"/><animate attributeName="fill" values="#ffffff;#ffd700;#ffffff" dur="4s" repeatCount="indefinite"/>`,
      sirius_b: `<circle cx="50" cy="50" r="40" fill="#d0d0d0"/><circle cx="40" cy="60" r="6" fill="#b0b0b0" opacity="0.8"/>`
    };

    // === Регионы ===
    const regionsConfig = {
      solar: {
        name: "Солнечная система",
        multiplier: 1,
        objects: [
          { id: 'mercury', name: 'Меркурий', symbol: '☿', click: 100 },
          { id: 'venus', name: 'Венера', symbol: '♀', click: 200 },
          { id: 'earth', name: 'Земля', symbol: '🜨', click: 300 },
          { id: 'mars', name: 'Марс', symbol: '♂', click: 500 },
          { id: 'jupiter', name: 'Юпитер', symbol: '♃', click: 1000 },
          { id: 'saturn', name: 'Сатурн', symbol: '♄', click: 2000 },
          { id: 'uranus', name: 'Уран', symbol: '⛢', click: 5000 },
          { id: 'neptune', name: 'Нептун', symbol: '♆', click: 10000 },
          { id: 'pluto', name: 'Плутон', symbol: '♇', click: 20000 }
        ],
        cost: 0
      },
      proxima: {
        name: "Проксима Центавра",
        multiplier: 2,
        objects: [
          { id: 'proxima_b', name: 'Проксима b', symbol: '🜨', click: 5000 }
        ],
        cost: 100
      },
      sirius: {
        name: "Сириус",
        multiplier: 3,
        objects: [
          { id: 'sirius_a', name: 'Сириус A', symbol: '☉', click: 15000 },
          { id: 'sirius_b', name: 'Сириус B', symbol: '🜔', click: 20000 }
        ],
        cost: 300
      }
    };

    // === Улучшения ===
    const upgrades = [
      { type: 'probe', region: 'solar', planet: 'mercury', name: 'Зонд: Меркурий', cost: 10000, income: 1 },
      { type: 'probe', region: 'solar', planet: 'mars', name: 'Зонд: Марс', cost: 100000, income: 10 },
      { type: 'rover', region: 'solar', planet: 'mars', name: 'Марсоход', cost: 200000, income: 5 },
      { type: 'probe', region: 'proxima', planet: 'proxima_b', name: 'Зонд: Проксима b', cost: 200000, income: 20 },
      { type: 'rocket', name: 'Ракета', cost: 5000000, globalIncome: 0.1 },
      { type: 'black_hole', name: 'Чёрная дыра', cost: 50000000, clickMult: 2 }
    ];

    // === DOM ===
    const balanceEl = document.getElementById('balance');
    const incomeEl = document.getElementById('income');
    const regionTitleEl = document.getElementById('region-title');
    const planetsContainer = document.getElementById('planets-container');
    const shopEl = document.getElementById('shop-items');
    const travelBtn = document.getElementById('travel-btn');

    // === Активность ===
    const sessionStart = Date.now();
    let clickCount = 0;

    // === Обработка клика ===
    function handlePlanetClick(planet, regionId) {
      const mult = regionsConfig[regionId].multiplier;
      const baseClick = planet.click;
      let clickMult = 1;
      if (regionStates[regionId]?.black_holes > 0) clickMult = 2;
      
      displayScore += baseClick * mult * clickMult;
      clickCount++;
      updateUI();
      
      const el = document.getElementById(`planet-${planet.id}`);
      el.style.transform = 'scale(1.15)';
      setTimeout(() => {
        if (el) el.style.transform = '';
      }, 200);
    }

    // === Покупка ===
    function buyUpgrade(upg) {
      if (displayScore < upg.cost) return;
      displayScore -= upg.cost;
      
      if (!regionStates[currentRegion]) regionStates[currentRegion] = {};
      const state = regionStates[currentRegion];
      
      if (upg.type === 'probe') {
        state.probes = state.probes || {};
        state.probes[upg.planet] = (state.probes[upg.planet] || 0) + 1;
      } else if (upg.type === 'rover') {
        state.rovers = state.rovers || {};
        state.rovers[upg.planet] = (state.rovers[upg.planet] || 0) + 1;
      } else if (upg.type === 'rocket') {
        state.rockets = (state.rockets || 0) + 1;
      } else if (upg.type === 'black_hole') {
        state.black_holes = (state.black_holes || 0) + 1;
      }
      
      tg.sendData(JSON.stringify({ action: "buy_upgrade", upgrade: upg }));
      updateUI();
    }

    // === Доход (для отображения) ===
    function calculateDisplayIncome() {
      const state = regionStates[currentRegion] || {};
      const region = regionsConfig[currentRegion];
      let total = 0;
      
      if (region.objects) {
        region.objects.forEach(obj => {
          const probes = state.probes?.[obj.id] || 0;
          const rovers = state.rovers?.[obj.id] || 0;
          total += probes * 10 + rovers * 5;
        });
      }
      
      total += (state.rockets || 0) * 0.1 * (region.objects?.length || 1);
      return total * region.multiplier;
    }

    // === Обновление UI ===
    function updateUI() {
      regionTitleEl.textContent = regionsConfig[currentRegion].name;
      balanceEl.textContent = formatNumber(displayScore);
      incomeEl.textContent = `Доход: ${calculateDisplayIncome().toFixed(1)} ₿/сек`;
      renderPlanets();
      renderShop();
    }

    // === Рендер планет ===
    function renderPlanets() {
      planetsContainer.innerHTML = '';
      const region = regionsConfig[currentRegion];
      if (!region.objects) return;
      
      region.objects.forEach(obj => {
        const container = document.createElement('div');
        container.className = 'planet-container';
        
        const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
        svg.setAttribute('id', `planet-${obj.id}`);
        svg.setAttribute('class', 'planet-svg');
        svg.setAttribute('viewBox', '0 0 100 100');
        svg.innerHTML = planetSVGs[obj.id] || `<circle cx="50" cy="50" r="40" fill="#666"/>`;
        svg.addEventListener('click', () => handlePlanetClick(obj, currentRegion));
        container.appendChild(svg);

        const nameEl = document.createElement('div');
        nameEl.className = 'planet-name';
        nameEl.textContent = obj.name;
        container.appendChild(nameEl);
        
        planetsContainer.appendChild(container);
      });
    }

    // === Рендер магазина ===
    function renderShop() {
      shopEl.innerHTML = '';
      const relevantUpgrades = upgrades.filter(u => 
        u.region === currentRegion || !u.region
      );
      
      relevantUpgrades.forEach(upg => {
        const div = document.createElement('div');
        div.className = 'upgrade-item';
        div.innerHTML = `
          <span>${upg.name}</span>
          <button class="buy-btn" data-cost="${upg.cost}">
            ${formatNumber(upg.cost)}
          </button>
        `;
        div.querySelector('button').addEventListener('click', () => buyUpgrade(upg));
        shopEl.appendChild(div);
      });
    }

    // === Звёздная карта ===
    travelBtn.addEventListener('click', () => {
      document.getElementById('star-map').style.display = 'block';
    });

    document.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', (e) => {
        const regionId = star.dataset.id;
        const region = regionsConfig[regionId];
        
        if (!unlockedRegions.includes(regionId)) {
          alert(`Требуется ${region.cost} астромонет для открытия!`);
          return;
        }
        
        // Анимация корабля
        const ship = document.getElementById('ship');
        const sun = document.querySelector('#sun-group circle');
        const target = star.querySelector('circle');
        
        const startX = parseFloat(sun.getAttribute('cx'));
        const startY = parseFloat(sun.getAttribute('cy'));
        const endX = parseFloat(target.getAttribute('cx'));
        const endY = parseFloat(target.getAttribute('cy'));
        
        ship.setAttribute('cx', startX);
        ship.setAttribute('cy', startY);
        ship.style.opacity = '1';
        
        let start = null;
        const duration = 2000;
        const animate = (timestamp) => {
          if (!start) start = timestamp;
          const progress = Math.min((timestamp - start) / duration, 1);
          const x = startX + (endX - startX) * progress;
          const y = startY + (endY - startY) * progress;
          ship.setAttribute('points', `${x-2},${y+2} ${x+2},${y+2} ${x},${y-2}`);
          if (progress < 1) {
            requestAnimationFrame(animate);
          } else {
            currentRegion = regionId;
            document.getElementById('star-map').style.display = 'none';
            updateUI();
            tg.sendData(JSON.stringify({ action: "travel", region: regionId }));
          }
        };
        requestAnimationFrame(animate);
      });
    });

    // === Астероиды ===
    function spawnAsteroid() {
      if (document.querySelector('.asteroid')) return;
      
      const asteroid = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
      asteroid.setAttribute('class', 'asteroid');
      asteroid.setAttribute('viewBox', '0 0 100 100');
      asteroid.innerHTML = `<circle cx="50" cy="50" r="45" fill="#555"/><circle cx="30" cy="30" r="10" fill="#777"/>`;
      
      const x = 10 + Math.random() * 80;
      const y = 20 + Math.random() * 60;
      asteroid.style.left = `${x}%`;
      asteroid.style.top = `${y}%`;
      
      const bonus = Math.floor(10000 + Math.random() * 90000);
      asteroid.addEventListener('click', () => {
        displayScore += bonus;
        updateUI();
        asteroid.remove();
        tg.sendData(JSON.stringify({ action: "asteroid_bonus", bonus: bonus }));
      });
      
      document.body.appendChild(asteroid);
      setTimeout(() => {
        if (asteroid.parentNode) asteroid.remove();
      }, 5000);
    }

    setInterval(() => {
      if (Math.random() < 0.25) spawnAsteroid();
    }, 25000);

    // === Завершение сессии ===
    window.addEventListener('beforeunload', () => {
      const seconds = Math.floor((Date.now() - sessionStart) / 1000);
      if (seconds > 0 && clickCount > 0) {
        tg.sendData(JSON.stringify({
          action: "session_summary",
          active_seconds: seconds,
          clicks: clickCount
        }));
      }
    });

    // === Вспомогательные функции ===
    function formatNumber(num) {
      if (num >= 1e9) return (num / 1e9).toFixed(2) + 'B';
      if (num >= 1e6) return (num / 1e6).toFixed(2) + 'M';
      if (num >= 1e3) return (num / 1e3).toFixed(2) + 'K';
      return Math.floor(num).toString();
    }

    // === Запуск ===
    updateUI();
  </script>
</body>
</html>
